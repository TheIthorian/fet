services:
  mongodb-test:
    image: mongo:8
    ports:
      - '27018:27017'
    tmpfs:
      - /data/db

  test-main:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm --filter @fet/main test"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/main-nest/node_modules
    environment:
      MONGODB_URI: mongodb://mongodb-test:27017/fet-test
      JWT_SECRET: test-secret
      INTERNAL_KEY: test-internal-key
      JOURNEY_SERVICE_URL: http://localhost:3010
      PROXY_URL: http://localhost:3000
    depends_on:
      - mongodb-test

  test-journey-service:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm --filter @fet/journey-service test"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/journey-service/node_modules
    environment:
      MONGODB_URI: mongodb://mongodb-test:27017/fet-journey-test
      INTERNAL_KEY: test-internal-key
      MAIN_APP_URL: http://localhost:3000
    depends_on:
      - mongodb-test
